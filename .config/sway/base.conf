include ~/.config/sway/catppuccin.conf

set $mod Mod4
set $left h
set $down j
set $up k
set $right l
set $term alacritty
set $menu wofi --show drun
set $filemanager thunar 

set $ws1 " "
set $ws2 "󰈹 "
set $ws3 " "
set $ws4 " "
set $ws5 "󱧶 "
set $ws6 "󱫋 "

workspace $ws1
workspace $ws2
workspace $ws3
workspace $ws4
workspace $ws5
workspace $ws6

workspace $ws1

font Adwaita Mono 10

#gaps inner 0 
#gaps outer 0 

default_border pixel 2.7
default_floating_border pixel 2.7

blur enable
blur_xray enable
blur_radius 1
blur_passes 4
blur_noise 0
blur_brightness 1

default_dim_inactive 0.01

shadows enable
shadow_blur_radius 15

# animation_duration_ms 225

corner_radius 0 
layer_effects "waybar" {
    blur enable;
    blur_xray enable;
    blur_ignore_transparent enable;
    shadows enable;
#    corner_radius 9;
}

layer_effects "wofi" {
    blur enable;
    blur_ignore_transparent enable;
    blur_xray enable;
    shadows enable;
    # corner_radius 6;
}

for_window [title=".*"] {
    effects shader ~/.config/sway/wave.frag
    shader_args time $(( $(date +%s) + $(date +%N) / 1000000000 ))
}

